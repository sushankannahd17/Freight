[project]
name = "freightiq"
version = "0.1.0"
description = "FreightIQ - Production-grade intelligent freight forecasting and vessel chartering platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",

    # Database
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2.3",
    "geoalchemy2>=0.15.2",
    "alembic>=1.14.0",

    # Data Processing
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "openpyxl>=3.1.5",
    "pyarrow>=18.1.0",

    # ML & Forecasting
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.2",
    "lightgbm>=4.5.0",
    "statsmodels>=0.14.4",
    "shap>=0.46.0",

    # MLOps
    "mlflow>=2.18.0",

    # Task Queue
    "celery[redis]>=5.4.0",

    # Caching
    "redis>=5.2.0",

    # HTTP Clients
    "httpx>=0.28.1",
    "aiohttp>=3.11.11",

    # Data Validation
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",

    # Monitoring & Logging
    "python-json-logger>=3.2.1",
    "prometheus-client>=0.21.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",

    # Geospatial
    "shapely>=2.0.6",
    "geopy>=2.4.1",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.1",
    "faker>=33.1.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "black>=24.10.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.black]
line-length = 100
target-version = ["py312"]
